name: Deploy

# 触发条件：推送到 main 分支时自动执行
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码（在 GitHub Actions 机器上）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 把 web 应用代码传到服务器（服务器无需连 GitHub）
      # 注意：source 是 "app/web/"，target 必须是仓库根目录，
      # 这样解压后才落在 ~/cloudops-platform/app/web/（否则会嵌套成 app/web/app/web/）
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "app/web/"
          target: "~/cloudops-platform"

      # 3. SSH 进服务器：验证代码 → 重建镜像 → 重启容器
      - name: Rebuild and run on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/cloudops-platform/app/web
            echo "服务器上的版本号："
            grep version app.py
            docker build -t cloudops-web .
            docker stop web || true
            docker rm web || true
            docker run -d --name web --restart unless-stopped --memory=256m -p 5000:5000 cloudops-web
            echo "部署完成，等待健康检查..."
            sleep 5
            curl -f http://localhost:5000/api/health && echo "OK"

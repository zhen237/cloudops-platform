name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ===== 构建任务 =====
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t cloudops-platform:${{ github.sha }} ./app/web

      - name: Save Docker image
        run: |
          docker save cloudops-platform:${{ github.sha }} | gzip > cloudops-platform.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: cloudops-platform.tar.gz

  # ===== 部署任务 =====
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Deploy to ECS
        run: |
          # 解压镜像
          gunzip cloudops-platform.tar.gz
          
          # SSH 部署
          scp cloudops-platform.tar root@${{ secrets.ECS_HOST }}:/tmp/
          ssh root@${{ secrets.ECS_HOST }} "docker load < /tmp/cloudops-platform.tar"
          ssh root@${{ secrets.ECS_HOST }} "cd /opt/cloudops-platform/app && docker-compose pull && docker-compose up -d"

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.ECS_HOST }}:5000/api/health || exit 1

  # ===== 测试任务 =====
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Start services
        run: |
          docker-compose up -d
          sleep 5

      - name: Run health check
        run: |
          curl -f http://localhost:5000/api/health || exit 1

      - name: Test metrics endpoint
        run: |
          curl -f http://localhost:5000/api/metrics || exit 1

      - name: Stop services
        run: |
          docker-compose down
